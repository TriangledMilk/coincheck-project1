<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoinCheck</title>
    <link rel="icon" type="image/png" href="./assets/jetpack_cat.png"/>
  </head>

<!-- idk what im doing-->
  <body>
    <h1 id="title">CoinCheck</h1>

    <!--<div id="update">
      <p>Update coin values based on real time silver prices (per troy ounce)</p>
      <p id="lastUpdated">Last Updated: </p>
      <button onclick="AgPriceCheck()">Update Price</button>
    </div>-->
    <div class="chart-input-layout">

      <div id="chart">

        <p class ="centerPara step3"><span>Caution: </span> <span id="valCheck3">...</span><span class="explainer"> +10% Premium</span></p>

        <p class ="centerPara step2"><span>Your preference: </span> <span id="valCheck2">...</span><span class="explainer"> +5% Premium</span></p>

        <p class ="centerPara step1" id="valCheck"><span>Decent purchase: </span> <span id="valCheck1">...</span><span class="explainer"> +2% Premium</span></p>

        <div id="coinCompositionVal">
          <p id="coinLabel">...</p>
          <p id="coinVal"></p>
        </div>

        <p class ="centerPara step1"><span>Good deal: </span> <span id="downCheck1">...</span><span class="explainer"> +10% Premium</span></p>

        <p class ="centerPara step2"><span>Your preference: </span> <span id="downCheck2">...</span><span class="explainer"> +5% Premium</span></p>

        <p class ="centerPara step3"><span>Caution: </span> <span id="downCheck3">...</span><span class="explainer"> +2% Premium</span></p>
        
        
      </div> <!-- end chart -->

      <div id="input">
        <h2 class="label">Input your coin values.</h2>
        <p class="centerPara">Use <a href="https://en.numista.com/" target="_blank" rel="noopener noreferrer">Numista</a> to check the coin weight and purity.</p>

        <form id="coinInput">

          <div id="coinMetal">
            <label class ="radio-button" for="AgCoin">
              <input type="radio" id="AgCoin" name="coinType" value="silver">
              <span class="zalandoExpanded">Silver (Ag)</span>
            </label>
            

            <label class ="radio-button" for="AuCoin">
              <input type="radio" id="AuCoin" name="coinType" value="gold">
              <span class="zalandoExpanded">Gold (Au)</span>
            </label>

          </div> <!-- end coinMetal -->

          <div id="weight">
            <label for="coinWeight">Coin Weight (in grams):</label><br>
            <input 
            type="number" 
            id="coinWeight" 
            name="coinWeight" 
            step="0.01"  
            placeholder="12.00"
            required>
          </div> <!-- end weight -->
          
          <div id="purity">
            <label for="coinPurity">Coin Purity:</label><br>
            <input 
            type="text" 
            id="coinPurity" 
            name="coinPurity" 
            inputmode="decimal" 
            maxlength="6" 
            pattern="(?:0(?:\.\d{1,4})?|1(?:\.0{1,4})?)" 
            placeholder="0.9250" 
            title="Enter a value from 0 to 1 with up to 4 decimal places."
            required>
          </div> <!-- end purity -->

          <button class="styleButton zalandoExpanded" type="submit">Check</button>

        </form><!-- end form -->

      </div> <!-- end input -->

    </div> <!-- end chart-input-layout -->

    <script src="main.js"></script>
  </body>
</html>
